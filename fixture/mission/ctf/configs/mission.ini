################################
# CTF configuration for the cFS mission fixture.
#
# Everything environment-specific comes from environment variables, which
# CTF exposes to this file as ${NAME} (they are loaded into [DEFAULT]).
# run_ctf.sh sets all of them; see ../README.md for the table.
#
#   CFS_ROOT          cFS source+build tree (contains the executable's run dir)
#   CFS_RUN_DIR       directory holding core-cpu1 and its cf/ folder; the
#                     executable is started with this as its working directory
#   CTF_CCDD_DIR      directory of CCDD JSON definitions (ccdd/json)
#   CTF_HEADER_DIR    directory holding cfe7_ccsds.py (headers/)
#   CTF_RESULTS_DIR   where CTF writes logs and result files
#   CTF_BUILD_CFS     "true" to run CTF_BUILD_CMD before each StartCfs (default false)
#   CTF_BUILD_CMD     shell command that rebuilds cFS, run in CFS_ROOT
################################

[core]
ctf_verification_timeout = 10.0
ctf_verification_poll_period = 0.5
reset_plugins_between_scripts = true
end_test_on_fail = false
additional_plugins_path =
disabled_plugins =
ignored_instructions =

[logging]
results_output_dir = ${CTF_RESULTS_DIR}
ctf_log_file = CTF_Log_File.log
json_results = True
log_level = DEBUG

[ccsds]
CCSDS_header_info_included = false
# cFE 7 headers: 8-byte command header, 16-byte telemetry header
# (6 primary + 6 time + 4 spare); see headers/cfe7_ccsds.py.
CCSDS_header_path = ${CTF_HEADER_DIR}/cfe7_ccsds.py

[cfs]
workspace_dir = ${CFS_ROOT}
cfs_protocol = local

# The fixture runs an already-built core-cpu1; CTF does not build it.
build_cfs = ${CTF_BUILD_CFS}
cfs_build_dir = ${CFS_ROOT}
cfs_build_cmd = ${CTF_BUILD_CMD}

cfs_run_dir = ${CFS_RUN_DIR}
cfs_exe = core-cpu1
cfs_port_arg = False
# Cold boot. The argument also makes CTF's "already running?" check and its
# pkill (both match the full command line "core-cpu1 --reset PO") specific to
# instances started by CTF, so an unrelated ./core-cpu1 is neither mistaken for
# ours nor killed.
cfs_run_args = --reset PO
# Deleted before each start so every run boots with an empty RAM disk.
cfs_ram_drive_path = /dev/shm/osal:RAM
cfs_output_file = cfs_stdout.txt
remove_continuous_on_fail = True

# Target name inside the CCDD "mids" list (mission_mids.json)
CCSDS_target = set1
CCSDS_data_dir = ${CTF_CCDD_DIR}
log_ccsds_imports = true
endianess_of_target = little
ccsds_ver = 1
send_crc = false

evs_log_file = evs_event_msgs.log
evs_event_mid_name = CFE_EVS_LONG_EVENT_MSG_MID
evs_short_event_mid_name = CFE_EVS_SHORT_EVENT_MSG_MID
evs_messages_clear_after_time = 5

cfs_debug = false
telemetry_debug = false
# Headless: cFS runs as a plain child process, stdout goes to cfs_output_file.
cfs_run_in_xterm = False

# CI_LAB listens on 1234; TO_LAB sends telemetry to 2234.
cfs_target_ip = 127.0.0.1
cmd_udp_port = 1234
tlm_udp_port = 2234
tlm_app_choice = ToApi

# Target section used by the tests (RegisterCfs / StartCfs "target": "mission").
# Unset fields fall back to [cfs].
[mission]
cfs_protocol = local

# The sections below are read by CTF plugins at start-up even when unused.
[ssh]
command_timeout = 60
print_stdout = False
log_stdout = True

[test_variable]
variable_1 = 10

[trick]
hostname = localhost
port = 7000
